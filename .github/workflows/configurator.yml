name: Configurator CI

on:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "apps/configurator/**"
      - "firmware/keys/**"
      - "firmware/Core/Inc/updater_shared.h"
      - "firmware/Core/Inc/firmware_public_key.h"
      - "firmware/Core/Src/updater_shared.c"
      - "firmware/Core/Src/updater_validation.c"
      - "firmware/Bootloader/**"
      - "firmware/tests/release_signing_vectors.json"
      - "tools/host/**"
      - "tools/release/**"
      - ".github/workflows/configurator.yml"
  pull_request:
    paths:
      - "apps/configurator/**"
      - "firmware/keys/**"
      - "firmware/Core/Inc/updater_shared.h"
      - "firmware/Core/Inc/firmware_public_key.h"
      - "firmware/Core/Src/updater_shared.c"
      - "firmware/Core/Src/updater_validation.c"
      - "firmware/Bootloader/**"
      - "firmware/tests/release_signing_vectors.json"
      - "tools/host/**"
      - "tools/release/**"
      - ".github/workflows/configurator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build configurator
    runs-on: windows-2022

    env:
      KBHE_RELEASE_OWNER: ${{ github.repository_owner }}
      KBHE_RELEASE_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        working-directory: apps/configurator
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: apps/configurator
        run: bun test

      - name: Lint frontend
        working-directory: apps/configurator
        run: bun run lint

      - name: Build frontend
        working-directory: apps/configurator
        run: bun run build

      - name: Check Tauri backend
        working-directory: apps/configurator/src-tauri
        run: cargo check --locked

      - name: Test Tauri backend
        working-directory: apps/configurator/src-tauri
        run: cargo test --locked

  release_codesign:
    name: Build Authenticode installer
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    concurrency:
      group: configurator-codesign-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2022
    environment: app-codesign
    permissions:
      contents: read

    env:
      KBHE_RELEASE_OWNER: ${{ github.repository_owner }}
      KBHE_RELEASE_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main"
          }

      - name: Validate release version metadata
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $package = (Get-Content apps/configurator/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content apps/configurator/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path apps/configurator/src-tauri/Cargo.toml `
            -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($null -eq $cargoMatch) {
            throw "Unable to read the Cargo package version"
          }
          $cargo = $cargoMatch.Matches[0].Groups[1].Value
          if ($expected -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "App release tag must be a stable app-vMAJOR.MINOR.PATCH tag"
          }
          if ($package -ne $expected -or $tauri -ne $expected -or $cargo -ne $expected) {
            throw "Tag $expected does not match package=$package, tauri=$tauri, cargo=$cargo"
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        working-directory: apps/configurator
        run: bun install --frozen-lockfile

      - name: Validate Authenticode configuration
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.KBHE_WINDOWS_CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.KBHE_WINDOWS_CODESIGN_PASSWORD }}
          CODESIGN_MODE: ${{ vars.KBHE_WINDOWS_CODESIGN_MODE }}
          EXPECTED_CODESIGN_THUMBPRINT: ${{ vars.KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:CODESIGN_PASSWORD)) {
            throw "app-codesign is missing the required Authenticode PFX secrets"
          }
          if ($env:CODESIGN_MODE -notin @("public-ca", "self-signed-bootstrap")) {
            throw "KBHE_WINDOWS_CODESIGN_MODE must be public-ca or self-signed-bootstrap"
          }
          $expected = ($env:EXPECTED_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($expected -notmatch '^[0-9A-F]{40}$') {
            throw "KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT must contain exactly 40 hexadecimal digits"
          }

      - name: Prepare pre-bundle Authenticode signing
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.KBHE_WINDOWS_CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.KBHE_WINDOWS_CODESIGN_PASSWORD }}
          CODESIGN_MODE: ${{ vars.KBHE_WINDOWS_CODESIGN_MODE }}
          EXPECTED_CODESIGN_THUMBPRINT: ${{ vars.KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "kbhe-authenticode.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "kbhe-authenticode-public.cer"
          $committedCertificatePath = "apps/configurator/keys/kbhe-community-authenticode.pem"
          $securePassword = $null
          try {
            if (-not (Test-Path -LiteralPath $committedCertificatePath)) {
              throw "Committed Authenticode public certificate is missing"
            }
            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:CODESIGN_PFX_B64)
            )
            $securePassword = ConvertTo-SecureString $env:CODESIGN_PASSWORD -AsPlainText -Force
            $imported = @(
              Import-PfxCertificate -FilePath $pfxPath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword
            )
            $candidates = @(
              $imported | Where-Object {
                $_.HasPrivateKey -and
                @($_.EnhancedKeyUsageList | Where-Object {
                  [string]$_.ObjectId -eq "1.3.6.1.5.5.7.3.3"
                }).Count -gt 0
              }
            )
            if ($candidates.Count -ne 1) {
              throw "PFX must contain exactly one private-key code-signing certificate"
            }
            $certificate = $candidates[0]
            $expected = ($env:EXPECTED_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
            $actual = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($actual -ne $expected) {
              throw "PFX certificate thumbprint does not match the protected environment variable"
            }
            $committedCertificatePem = `
              Get-Content -LiteralPath $committedCertificatePath -Raw
            $committedCertificateBase64 = `
              $committedCertificatePem `
                -replace '-----BEGIN CERTIFICATE-----', '' `
                -replace '-----END CERTIFICATE-----', '' `
                -replace '\s', ''
            $committedCertificate = `
              [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                [Convert]::FromBase64String($committedCertificateBase64)
              )
            $committedThumbprint = `
              ($committedCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($committedThumbprint -ne $expected -or
                [Convert]::ToBase64String($committedCertificate.RawData) -ne
                  [Convert]::ToBase64String($certificate.RawData)) {
              throw "PFX certificate does not match the committed Authenticode certificate"
            }
            if ($certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -le (Get-Date)) {
              throw "Authenticode certificate is not currently valid"
            }
            $basicConstraints = $certificate.Extensions |
              Where-Object { $_.Oid.Value -eq "2.5.29.19" } |
              Select-Object -First 1
            if ($null -ne $basicConstraints -and $basicConstraints.CertificateAuthority) {
              throw "The Authenticode leaf certificate must not be a CA"
            }
            $keyUsage = $certificate.Extensions |
              Where-Object { $_.Oid.Value -eq "2.5.29.15" } |
              Select-Object -First 1
            if ($null -ne $keyUsage -and
                ($keyUsage.KeyUsages -band [Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature) -eq 0) {
              throw "Authenticode certificate does not allow digital signatures"
            }

            Export-Certificate -Cert $certificate -FilePath $cerPath -Type CERT | Out-Null
            if ($env:CODESIGN_MODE -eq "self-signed-bootstrap") {
              if ($certificate.Subject -ne $certificate.Issuer) {
                throw "self-signed-bootstrap mode requires a self-issued certificate"
              }
              $trusted = Import-Certificate -FilePath $cerPath `
                -CertStoreLocation Cert:\CurrentUser\Root
              if (($trusted.Thumbprint -replace '\s', '').ToUpperInvariant() -ne $expected) {
                throw "Unexpected bootstrap trust-root thumbprint"
              }
              "KBHE_CODESIGN_BOOTSTRAP_ROOT_THUMBPRINT=$expected" |
                Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Output "::warning::Bootstrap Authenticode is self-signed. Windows users will still see an unknown-publisher/SmartScreen warning. Detached Ed25519 authentication remains mandatory."
            } elseif ($certificate.Subject -eq $certificate.Issuer) {
              throw "public-ca mode refuses a self-issued Authenticode certificate"
            }

            "KBHE_CODESIGN_THUMBPRINT=$expected" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "KBHE_CODESIGN_MODE=$env:CODESIGN_MODE" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $windowsBundle = @{
              certificateThumbprint = $expected
              digestAlgorithm = "sha256"
            }
            if ($env:CODESIGN_MODE -eq "public-ca") {
              $windowsBundle.timestampUrl = "http://timestamp.digicert.com"
              $windowsBundle.tsp = $true
            }
            @{
              bundle = @{ windows = $windowsBundle }
            } | ConvertTo-Json -Depth 4 |
              Set-Content apps/configurator/src-tauri/tauri.windows.conf.json -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:CODESIGN_PFX_B64 -ErrorAction SilentlyContinue
            Remove-Item Env:CODESIGN_PASSWORD -ErrorAction SilentlyContinue
            $securePassword = $null
          }

      - name: Build Authenticode-signed installers
        working-directory: apps/configurator
        run: bun tauri build

      - name: Verify and stage signed installers
        shell: pwsh
        run: |
          $expected = ($env:KBHE_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          $signtool = @(
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
              Sort-Object FullName -Descending
          ) | Select-Object -First 1
          if ($null -eq $signtool) {
            throw "Windows SDK signtool.exe was not found"
          }

          $mainExecutable = Get-Item `
            "apps/configurator/src-tauri/target/release/kbhe-configurator.exe"
          $installers = @(
            Get-ChildItem "apps/configurator/src-tauri/target/release/bundle" -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") }
          )
          if ($installers.Count -eq 0) {
            throw "No Windows installer asset was produced"
          }
          if (@($installers | Group-Object Name | Where-Object { $_.Count -ne 1 }).Count -ne 0) {
            throw "Installer filenames must be unique before artifact transfer"
          }

          foreach ($signedFile in @($mainExecutable) + $installers) {
            if ($env:KBHE_CODESIGN_MODE -eq "public-ca") {
              & $signtool.FullName verify /pa /tw /v $signedFile.FullName
            } else {
              & $signtool.FullName verify /pa /v $signedFile.FullName
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($signedFile.FullName)"
            }
            $signature = Get-AuthenticodeSignature -FilePath $signedFile.FullName
            $actual = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $actual -ne $expected -or
                ($env:KBHE_CODESIGN_MODE -eq "public-ca" -and
                  $null -eq $signature.TimeStamperCertificate)) {
              throw "Signer, trust, or required RFC3161 timestamp validation failed for $($signedFile.Name)"
            }
          }

          $staging = Join-Path $env:GITHUB_WORKSPACE "release-staging"
          if (Test-Path -LiteralPath $staging) {
            throw "Release staging directory unexpectedly already exists"
          }
          New-Item -ItemType Directory -Path $staging | Out-Null
          $records = @(
            foreach ($installer in $installers) {
              $destination = Join-Path $staging $installer.Name
              Copy-Item -LiteralPath $installer.FullName -Destination $destination
              $copy = Get-Item -LiteralPath $destination
              [ordered]@{
                name = $copy.Name
                size = $copy.Length
                sha256 = (Get-FileHash -LiteralPath $copy.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )
          $certificate = Get-Item "Cert:\CurrentUser\My\$expected"
          Export-Certificate -Cert $certificate `
            -FilePath (Join-Path $staging "kbhe-authenticode-public.cer") `
            -Type CERT | Out-Null
          [ordered]@{
            schemaVersion = 1
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            codesignMode = $env:KBHE_CODESIGN_MODE
            signerThumbprint = $expected
            assets = @($records)
          } | ConvertTo-Json -Depth 5 |
            Set-Content (Join-Path $staging "kbhe-release-input.json") -Encoding utf8

      - name: Upload private signed-installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbhe-configurator-authenticode-${{ github.sha }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove release certificate from runner
        if: always()
        shell: pwsh
        env:
          EXPECTED_CODESIGN_THUMBPRINT: ${{ vars.KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT }}
        run: |
          $expected = ($env:EXPECTED_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($expected -match '^[0-9A-F]{40}$') {
            Remove-Item "Cert:\CurrentUser\My\$expected" `
              -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\Root\$expected" `
              -Force -ErrorAction SilentlyContinue
          }
          Remove-Item apps/configurator/src-tauri/tauri.windows.conf.json `
            -Force -ErrorAction SilentlyContinue

  release_authenticate_publish:
    name: Authenticate and publish installer
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: release_codesign
    concurrency:
      group: configurator-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2022
    environment: app-publish
    permissions:
      contents: write

    steps:
      - name: Checkout only release verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/release
            apps/configurator/keys
          sparse-checkout-cone-mode: false

      - name: Require tag commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main"
          }

      - name: Download private signed-installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kbhe-configurator-authenticode-${{ github.sha }}
          path: release-staging

      - name: Re-verify transferred Authenticode assets
        shell: pwsh
        env:
          CODESIGN_MODE: ${{ vars.KBHE_WINDOWS_CODESIGN_MODE }}
          EXPECTED_CODESIGN_THUMBPRINT: ${{ vars.KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT }}
        run: |
          if ($env:CODESIGN_MODE -notin @("public-ca", "self-signed-bootstrap")) {
            throw "KBHE_WINDOWS_CODESIGN_MODE must be public-ca or self-signed-bootstrap"
          }
          $expected = ($env:EXPECTED_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($expected -notmatch '^[0-9A-F]{40}$') {
            throw "KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT must contain exactly 40 hexadecimal digits"
          }

          $staging = Join-Path $env:GITHUB_WORKSPACE "release-staging"
          $manifestPath = Join-Path $staging "kbhe-release-input.json"
          $certificatePath = Join-Path $staging "kbhe-authenticode-public.cer"
          $committedCertificatePath = "apps/configurator/keys/kbhe-community-authenticode.pem"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or
              $manifest.tag -ne $env:GITHUB_REF_NAME -or
              $manifest.commit -ne $env:GITHUB_SHA -or
              $manifest.codesignMode -ne $env:CODESIGN_MODE -or
              (($manifest.signerThumbprint -replace '\s', '').ToUpperInvariant()) -ne $expected) {
            throw "Transferred release manifest does not match this protected tag job"
          }

          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
          $committedCertificatePem = `
            Get-Content -LiteralPath $committedCertificatePath -Raw
          $committedCertificateBase64 = `
            $committedCertificatePem `
              -replace '-----BEGIN CERTIFICATE-----', '' `
              -replace '-----END CERTIFICATE-----', '' `
              -replace '\s', ''
          $committedCertificate = `
            [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              [Convert]::FromBase64String($committedCertificateBase64)
            )
          $certificateThumbprint = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          if ($certificateThumbprint -ne $expected -or
              (($committedCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()) -ne $expected -or
              [Convert]::ToBase64String($certificate.RawData) -ne
                [Convert]::ToBase64String($committedCertificate.RawData) -or
              $certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -le (Get-Date) -or
              @($certificate.EnhancedKeyUsageList | Where-Object {
                [string]$_.ObjectId -eq "1.3.6.1.5.5.7.3.3"
              }).Count -eq 0) {
            throw "Transferred public certificate failed thumbprint, validity, or EKU validation"
          }
          if ($env:CODESIGN_MODE -eq "self-signed-bootstrap") {
            if ($certificate.Subject -ne $certificate.Issuer) {
              throw "self-signed-bootstrap mode requires a self-issued certificate"
            }
            $trusted = Import-Certificate -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\Root
            if (($trusted.Thumbprint -replace '\s', '').ToUpperInvariant() -ne $expected) {
              throw "Unexpected bootstrap trust-root thumbprint on publication runner"
            }
            "KBHE_PUBLISH_BOOTSTRAP_ROOT_THUMBPRINT=$expected" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "::warning::Publishing a self-signed bootstrap Authenticode build; Windows will not treat it as a publicly trusted publisher."
          } elseif ($certificate.Subject -eq $certificate.Issuer) {
            throw "public-ca mode refuses a self-issued Authenticode certificate"
          }

          $records = @($manifest.assets)
          if ($records.Count -eq 0 -or
              @($records | Group-Object name | Where-Object { $_.Count -ne 1 }).Count -ne 0) {
            throw "Transferred manifest contains no assets or duplicate asset names"
          }
          $expectedNames = @($records | ForEach-Object { $_.name } | Sort-Object)
          foreach ($name in $expectedNames) {
            if ([IO.Path]::GetFileName($name) -ne $name -or
                [IO.Path]::GetExtension($name) -notin @(".exe", ".msi")) {
              throw "Unsafe or unsupported installer name in release manifest: $name"
            }
          }
          $actualNames = @(
            Get-ChildItem -LiteralPath $staging -File |
              Where-Object { $_.Name -notin @("kbhe-release-input.json", "kbhe-authenticode-public.cer") } |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          if (($expectedNames -join "`n") -ne ($actualNames -join "`n")) {
            throw "Private artifact contains a missing or unexpected installer"
          }

          $signtool = @(
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
              Sort-Object FullName -Descending
          ) | Select-Object -First 1
          if ($null -eq $signtool) {
            throw "Windows SDK signtool.exe was not found"
          }
          foreach ($record in $records) {
            $asset = Get-Item -LiteralPath (Join-Path $staging $record.name)
            $digest = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([int64]$record.size -ne $asset.Length -or $record.sha256 -ne $digest) {
              throw "Transferred installer digest or size mismatch for $($asset.Name)"
            }
            if ($manifest.codesignMode -eq "public-ca") {
              & $signtool.FullName verify /pa /tw /v $asset.FullName
            } else {
              & $signtool.FullName verify /pa /v $asset.FullName
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($asset.Name)"
            }
            $signature = Get-AuthenticodeSignature -FilePath $asset.FullName
            $actual = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $actual -ne $expected -or
                ($manifest.codesignMode -eq "public-ca" -and
                  $null -eq $signature.TimeStamperCertificate)) {
              throw "Signer, trust, or required RFC3161 timestamp validation failed for $($asset.Name)"
            }
          }
          "KBHE_PUBLISH_CODESIGN_THUMBPRINT=$expected" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create, authenticate, verify, and publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY_B64: ${{ secrets.KBHE_APP_RELEASE_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64)) {
            throw "app-publish is missing KBHE_APP_RELEASE_SIGNING_KEY_B64"
          }
          $publicKey = "apps/configurator/keys/app-ed25519-public.pem"
          if (-not (Test-Path -LiteralPath $publicKey)) {
            throw "Committed app release public key is missing: $publicKey"
          }

          $staging = Join-Path $env:GITHUB_WORKSPACE "release-staging"
          $manifest = Get-Content (Join-Path $staging "kbhe-release-input.json") -Raw |
            ConvertFrom-Json
          $records = @($manifest.assets)
          $keyPath = Join-Path $env:RUNNER_TEMP "kbhe-app-ed25519-private.pem"
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $downloadDir = [IO.Path]::GetFullPath(
            (Join-Path $runnerTemp "kbhe-release-verify-$([Guid]::NewGuid().ToString('N'))")
          )
          $tempPrefix = "$runnerTemp$([IO.Path]::DirectorySeparatorChar)"
          if (-not $downloadDir.StartsWith($tempPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Release verification directory escaped RUNNER_TEMP"
          }

          try {
            [IO.File]::WriteAllBytes(
              $keyPath,
              [Convert]::FromBase64String($env:SIGNING_KEY_B64)
            )
            Remove-Item Env:SIGNING_KEY_B64 -ErrorAction SilentlyContinue
            & openssl pkey -in $keyPath -check -noout
            if ($LASTEXITCODE -ne 0) {
              throw "Invalid app Ed25519 private key"
            }

            $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
            $uploadPaths = [Collections.Generic.List[string]]::new()
            foreach ($record in $records) {
              $asset = Get-Item -LiteralPath (Join-Path $staging $record.name)
              $signaturePath = "$($asset.FullName).sig"
              python tools/release/sign_release_asset.py app `
                --key $keyPath `
                --input $asset.FullName `
                --output $signaturePath `
                --version $version `
                --platform windows `
                --arch x86_64 `
                --role $asset.Name `
                --verify-public $publicKey
              if ($LASTEXITCODE -ne 0 -or (Get-Item $signaturePath).Length -ne 64) {
                throw "Failed to create a valid detached signature for $($asset.Name)"
              }
              $uploadPaths.Add($asset.FullName)
              $uploadPaths.Add($signaturePath)
            }

            & gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "A GitHub Release already exists for $env:GITHUB_REF_NAME; refusing replacement"
            }
            $notes = "Authenticated Windows installer build for KBHE Configurator."
            if ($manifest.codesignMode -eq "self-signed-bootstrap") {
              $notes += " Authenticode uses the explicitly disclosed self-signed bootstrap certificate, so Windows may report an unknown publisher; the sibling .sig files provide KBHE Ed25519 authentication."
            }
            $createArgs = @(
              "release", "create", $env:GITHUB_REF_NAME,
              "--verify-tag", "--draft",
              "--title", "KBHE Configurator $env:GITHUB_REF_NAME",
              "--notes", $notes
            ) + @($uploadPaths)
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the authenticated draft release"
            }

            New-Item -ItemType Directory -Path $downloadDir | Out-Null
            $release = gh release view $env:GITHUB_REF_NAME --json isDraft,assets |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) {
              throw "Failed to inspect the draft release"
            }
            $expectedNames = @(
              foreach ($record in $records) {
                $record.name
                "$($record.name).sig"
              }
            )
            if (@($release.assets).Count -ne $expectedNames.Count) {
              throw "Draft asset count does not match the authenticated set"
            }
            foreach ($remote in @($release.assets)) {
              if ($remote.name -notin $expectedNames) {
                throw "Draft contains unexpected asset $($remote.name)"
              }
            }

            $signtool = @(
              Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
                Sort-Object FullName -Descending
            ) | Select-Object -First 1
            foreach ($localPath in $uploadPaths) {
              $local = Get-Item -LiteralPath $localPath
              $matches = @($release.assets | Where-Object { $_.name -eq $local.Name })
              if ($matches.Count -ne 1 -or [int64]$matches[0].size -ne $local.Length) {
                throw "Draft metadata mismatch for $($local.Name)"
              }
              gh release download $env:GITHUB_REF_NAME --dir $downloadDir --pattern $local.Name
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to download draft asset $($local.Name)"
              }
              $downloaded = Get-Item -LiteralPath (Join-Path $downloadDir $local.Name)
              if ((Get-FileHash $local.FullName -Algorithm SHA256).Hash -ne
                  (Get-FileHash $downloaded.FullName -Algorithm SHA256).Hash) {
                throw "Downloaded draft digest mismatch for $($local.Name)"
              }
            }

            foreach ($record in $records) {
              $downloadedInstaller = Join-Path $downloadDir $record.name
              $downloadedSignature = "$downloadedInstaller.sig"
              if ($manifest.codesignMode -eq "public-ca") {
                & $signtool.FullName verify /pa /tw /v $downloadedInstaller
              } else {
                & $signtool.FullName verify /pa /v $downloadedInstaller
              }
              if ($LASTEXITCODE -ne 0) {
                throw "Downloaded Authenticode verification failed for $($record.name)"
              }
              $authenticode = Get-AuthenticodeSignature -FilePath $downloadedInstaller
              $actual = ($authenticode.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
              if ($authenticode.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                  $actual -ne $env:KBHE_PUBLISH_CODESIGN_THUMBPRINT -or
                  ($manifest.codesignMode -eq "public-ca" -and
                    $null -eq $authenticode.TimeStamperCertificate)) {
                throw "Downloaded signer or required timestamp mismatch for $($record.name)"
              }
              python tools/release/sign_release_asset.py app `
                --signature $downloadedSignature `
                --input $downloadedInstaller `
                --version $version `
                --platform windows `
                --arch x86_64 `
                --role $record.name `
                --verify-public $publicKey
              if ($LASTEXITCODE -ne 0) {
                throw "Downloaded Ed25519 verification failed for $($record.name)"
              }
            }

            gh release edit $env:GITHUB_REF_NAME --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish the authenticated release"
            }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $downloadDir) {
              Remove-Item -LiteralPath $downloadDir -Recurse -Force
            }
          }

      - name: Remove bootstrap trust root from publication runner
        if: always()
        shell: pwsh
        env:
          EXPECTED_CODESIGN_THUMBPRINT: ${{ vars.KBHE_WINDOWS_CODESIGN_CERT_THUMBPRINT }}
        run: |
          $expected = ($env:EXPECTED_CODESIGN_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($expected -match '^[0-9A-F]{40}$') {
            Remove-Item "Cert:\CurrentUser\Root\$expected" `
              -Force -ErrorAction SilentlyContinue
          }
