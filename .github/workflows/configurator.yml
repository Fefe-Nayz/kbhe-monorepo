name: Configurator CI

on:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "apps/configurator/**"
      - "firmware/keys/**"
      - "firmware/Core/Inc/updater_shared.h"
      - "firmware/Core/Inc/firmware_public_key.h"
      - "firmware/Core/Src/updater_shared.c"
      - "firmware/Core/Src/updater_validation.c"
      - "firmware/Bootloader/**"
      - "firmware/tests/release_signing_vectors.json"
      - "tools/host/**"
      - "tools/release/**"
      - ".github/workflows/configurator.yml"
  pull_request:
    paths:
      - "apps/configurator/**"
      - "firmware/keys/**"
      - "firmware/Core/Inc/updater_shared.h"
      - "firmware/Core/Inc/firmware_public_key.h"
      - "firmware/Core/Src/updater_shared.c"
      - "firmware/Core/Src/updater_validation.c"
      - "firmware/Bootloader/**"
      - "firmware/tests/release_signing_vectors.json"
      - "tools/host/**"
      - "tools/release/**"
      - ".github/workflows/configurator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build configurator
    runs-on: windows-latest

    env:
      KBHE_RELEASE_OWNER: ${{ github.repository_owner }}
      KBHE_RELEASE_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        working-directory: apps/configurator
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: apps/configurator
        run: bun test

      - name: Lint frontend
        working-directory: apps/configurator
        run: bun run lint

      - name: Build frontend
        working-directory: apps/configurator
        run: bun run build

      - name: Check Tauri backend
        working-directory: apps/configurator/src-tauri
        run: cargo check --locked

      - name: Test Tauri backend
        working-directory: apps/configurator/src-tauri
        run: cargo test --locked

  release:
    name: Build, authenticate, and publish installer
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    concurrency:
      group: configurator-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    env:
      KBHE_RELEASE_OWNER: ${{ github.repository_owner }}
      KBHE_RELEASE_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main"
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        working-directory: apps/configurator
        run: bun install --frozen-lockfile

      - name: Require release signing key
        shell: pwsh
        env:
          SIGNING_KEY_B64: ${{ secrets.KBHE_RELEASE_SIGNING_KEY_B64 }}
          CODESIGN_PFX_B64: ${{ secrets.KBHE_WINDOWS_CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.KBHE_WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64)) {
            throw "Missing required KBHE_RELEASE_SIGNING_KEY_B64 repository secret"
          }
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:CODESIGN_PASSWORD)) {
            throw "Missing required Windows Authenticode certificate secrets"
          }

      - name: Validate release version metadata
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $package = (Get-Content apps/configurator/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content apps/configurator/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path apps/configurator/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($null -eq $cargoMatch) {
            throw "Unable to read the Cargo package version"
          }
          $cargo = $cargoMatch.Matches[0].Groups[1].Value
          if ($expected -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "App release tag must be a stable app-vMAJOR.MINOR.PATCH tag"
          }
          if ($package -ne $expected -or $tauri -ne $expected -or $cargo -ne $expected) {
            throw "Tag $expected does not match package=$package, tauri=$tauri, cargo=$cargo"
          }

      - name: Prepare pre-bundle Authenticode signing
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.KBHE_WINDOWS_CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.KBHE_WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "kbhe-authenticode.pfx"
          try {
            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:CODESIGN_PFX_B64)
            )
            $securePassword = ConvertTo-SecureString $env:CODESIGN_PASSWORD -AsPlainText -Force
            $imported = @(
              Import-PfxCertificate -FilePath $pfxPath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword
            )
            $certificate = @(
              $imported | Where-Object {
                $_.HasPrivateKey -and
                @($_.EnhancedKeyUsageList | Where-Object {
                  $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3"
                }).Count -gt 0
              }
            ) | Select-Object -First 1
            if ($null -eq $certificate) {
              throw "PFX contains no private-key certificate valid for code signing"
            }
            if ($certificate.NotBefore -gt (Get-Date) -or
                $certificate.NotAfter -le (Get-Date)) {
              throw "Authenticode certificate is not currently valid"
            }

            "KBHE_CODESIGN_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Depth 4 |
              Set-Content apps/configurator/src-tauri/tauri.windows.conf.json -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:CODESIGN_PFX_B64 -ErrorAction SilentlyContinue
            Remove-Item Env:CODESIGN_PASSWORD -ErrorAction SilentlyContinue
            $securePassword = $null
          }

      - name: Build installer into a draft release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KBHE_RELEASE_OWNER: ${{ github.repository_owner }}
          KBHE_RELEASE_REPO: ${{ github.event.repository.name }}
        with:
          projectPath: apps/configurator
          tagName: ${{ github.ref_name }}
          releaseName: KBHE Configurator ${{ github.ref_name }}
          releaseBody: Installer build for KBHE Configurator.
          releaseDraft: true
          prerelease: false

      - name: Authenticate and sign draft installer assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY_B64: ${{ secrets.KBHE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64)) {
            throw "Missing required KBHE_RELEASE_SIGNING_KEY_B64 repository secret"
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "kbhe-ed25519-private.pem"
          [System.IO.File]::WriteAllBytes(
            $keyPath,
            [Convert]::FromBase64String($env:SIGNING_KEY_B64)
          )
          Remove-Item Env:SIGNING_KEY_B64 -ErrorAction SilentlyContinue

          try {
            $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
            $signtool = @(
              Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
                Sort-Object FullName -Descending
            ) | Select-Object -First 1
            if ($null -eq $signtool) {
              throw "Windows SDK signtool.exe was not found"
            }
            $assets = @(
              Get-ChildItem "apps/configurator/src-tauri/target/release/bundle" -Recurse -File |
                Where-Object { $_.Extension -in @(".exe", ".msi") }
            )
            if ($assets.Count -eq 0) {
              throw "No Windows installer asset was produced"
            }

            $mainExecutable = Get-Item `
              "apps/configurator/src-tauri/target/release/kbhe-configurator.exe"
            foreach ($signedFile in @($mainExecutable) + $assets) {
              & $signtool.FullName verify /pa /v $signedFile.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode verification failed for $($signedFile.FullName)"
              }
            }

            foreach ($asset in $assets) {
              $signaturePath = "$($asset.FullName).sig"
              python tools/release/sign_release_asset.py app `
                --key $keyPath `
                --input $asset.FullName `
                --output $signaturePath `
                --version $version `
                --platform windows `
                --arch x86_64 `
                --role $asset.Name `
                --verify-public firmware/keys/firmware-ed25519-public.pem
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to sign $($asset.FullName)"
              }
              gh release upload $env:GITHUB_REF_NAME $signaturePath --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload $signaturePath"
              }
            }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Remove release certificate from runner
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:KBHE_CODESIGN_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:KBHE_CODESIGN_THUMBPRINT" `
              -Force -ErrorAction SilentlyContinue
          }
          Remove-Item `
            apps/configurator/src-tauri/tauri.windows.conf.json `
            -Force -ErrorAction SilentlyContinue

      - name: Publish authenticated release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $downloadDir = [IO.Path]::GetFullPath(
            (Join-Path $runnerTemp "kbhe-release-verify-$([Guid]::NewGuid().ToString('N'))")
          )
          $tempPrefix = "$runnerTemp$([IO.Path]::DirectorySeparatorChar)"
          if (-not $downloadDir.StartsWith(
              $tempPrefix,
              [StringComparison]::OrdinalIgnoreCase
            )) {
            throw "Release verification directory escaped RUNNER_TEMP"
          }
          New-Item -ItemType Directory -Path $downloadDir | Out-Null

          try {
            $release = gh release view $env:GITHUB_REF_NAME `
              --json isDraft,assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to inspect the draft release"
            }
            if (-not $release.isDraft) {
              throw "Refusing to verify an already-published release"
            }

            $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
            $installers = @(
              Get-ChildItem "apps/configurator/src-tauri/target/release/bundle" -Recurse -File |
                Where-Object { $_.Extension -in @(".exe", ".msi") }
            )
            if ($installers.Count -eq 0) {
              throw "No local installer is available for release verification"
            }
            $duplicateLocalNames = @(
              $installers | Group-Object Name | Where-Object { $_.Count -ne 1 }
            )
            if ($duplicateLocalNames.Count -ne 0) {
              throw "Local installer names must be unique"
            }

            $expectedAssetNames = @(
              foreach ($installer in $installers) {
                $installer.Name
                "$($installer.Name).sig"
              }
            )
            if (@($release.assets).Count -ne $expectedAssetNames.Count) {
              throw "Draft asset count does not match the authenticated local asset set"
            }
            foreach ($remoteAsset in @($release.assets)) {
              if ($remoteAsset.name -notin $expectedAssetNames) {
                throw "Draft contains unexpected unauthenticated asset $($remoteAsset.name)"
              }
            }

            $remoteInstallers = @(
              $release.assets | Where-Object { $_.name -match '\.(exe|msi)$' }
            )
            if ($remoteInstallers.Count -ne $installers.Count) {
              throw "Draft installer count does not match the local build"
            }

            foreach ($installer in $installers) {
              $signature = Get-Item -LiteralPath "$($installer.FullName).sig"
              if ($signature.Length -ne 64) {
                throw "Invalid local signature size for $($installer.Name)"
              }

              foreach ($local in @($installer, $signature)) {
                $matches = @($release.assets | Where-Object { $_.name -eq $local.Name })
                if ($matches.Count -ne 1 -or [int64]$matches[0].size -ne $local.Length) {
                  throw "Draft asset mismatch for $($local.Name)"
                }

                gh release download $env:GITHUB_REF_NAME `
                  --dir $downloadDir `
                  --pattern $local.Name
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to download draft asset $($local.Name)"
                }
                $downloaded = Get-Item -LiteralPath (Join-Path $downloadDir $local.Name)
                $localHash = (Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash
                $remoteHash = (Get-FileHash -LiteralPath $downloaded.FullName -Algorithm SHA256).Hash
                if ($localHash -ne $remoteHash) {
                  throw "Downloaded draft asset digest mismatch for $($local.Name)"
                }
              }

              $downloadedInstaller = Join-Path $downloadDir $installer.Name
              $downloadedSignature = "$downloadedInstaller.sig"
              python tools/release/sign_release_asset.py app `
                --signature $downloadedSignature `
                --input $downloadedInstaller `
                --version $version `
                --platform windows `
                --arch x86_64 `
                --role $installer.Name `
                --verify-public firmware/keys/firmware-ed25519-public.pem
              if ($LASTEXITCODE -ne 0) {
                throw "Downloaded signature verification failed for $($installer.Name)"
              }
            }

            gh release edit $env:GITHUB_REF_NAME --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish the authenticated release"
            }
          } finally {
            if (Test-Path -LiteralPath $downloadDir) {
              Remove-Item -LiteralPath $downloadDir -Recurse -Force
            }
          }
