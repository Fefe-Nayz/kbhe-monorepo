name: Firmware CI

on:
  push:
    branches:
      - main
    tags:
      - "firmware-v*"
    paths:
      - "firmware/**"
      - "tools/host/**"
      - "tools/release/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/host/**"
      - "tools/release/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KBHE_UPDATER_REFRESH_MIN_CONFIGURATOR_VERSION: "0.1.18"
  KBHE_UPDATER_REFRESH_CARRIER_MIN_FIRMWARE_VERSION: "2.0.10"

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Configure first-party host tests
        run: cmake -S firmware/tests -B firmware/build-host-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build first-party host tests
        run: cmake --build firmware/build-host-tests

      - name: Run first-party host tests
        run: |
          ctest --test-dir firmware/build-host-tests --output-on-failure
          python tools/release/test_release_signing.py
          python tools/host/test_firmware_updater_selection.py
          python tools/host/test_device_protocol.py
          python tools/host/test_hil_input_logger.py
          python tools/host/test_kbhe_input_diagnostic.py

      - name: Configure Release
        run: cmake --preset Release

      - name: Build Release
        run: cmake --build --preset Release

      - name: Configure app-only Release
        run: cmake --preset Release-apponly

      - name: Build app-only Release
        run: cmake --build --preset Release-apponly

      - name: Package firmware artifacts
        run: |
          mkdir -p dist
          cp build/Release/kbhe.bin dist/kbhe-app.bin
          cp build/Release/kbhe.hex dist/kbhe-app.hex
          cp build/Release/kbhe.elf dist/kbhe-app.elf
          cp build/Release/kbhe.map dist/kbhe-app.map
          cp build/Release/kbhe_bootloader.bin dist/kbhe-bootloader.bin
          cp build/Release/kbhe_bootloader.hex dist/kbhe-bootloader.hex
          cp build/Release/kbhe_bootloader.elf dist/kbhe-bootloader.elf
          cp build/Release/kbhe_bootloader.map dist/kbhe-bootloader.map
          cp build/Release/kbhe_updater_migrator.bin dist/kbhe-updater-migrator.bin
          cp build/Release/kbhe_updater_migrator.hex dist/kbhe-updater-migrator.hex
          cp build/Release/kbhe_updater_migrator.elf dist/kbhe-updater-migrator.elf
          cp build/Release/kbhe_updater_migrator.map dist/kbhe-updater-migrator.map
          cp build/Release-apponly/kbhe.bin dist/kbhe-app-only.bin
          cp build/Release-apponly/kbhe.hex dist/kbhe-app-only.hex
          cp build/Release-apponly/kbhe.elf dist/kbhe-app-only.elf
          cp build/Release-apponly/kbhe.map dist/kbhe-app-only.map
          cat > dist/firmware-manifest.json <<EOF
          {
            "tag": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "primaryBinary": "kbhe-app.bin",
            "migrationExecutable": "kbhe-updater-migrator.bin"
          }
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbhe-firmware-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Sign and stage firmware release
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: build
    concurrency:
      group: firmware-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: firmware-release
    permissions:
      contents: write

    steps:
      - name: Checkout signing tooling and public key
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kbhe-firmware-${{ github.sha }}
          path: dist

      - name: Require updater-refresh capable configurator release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          minimum_app_tag="app-v${KBHE_UPDATER_REFRESH_MIN_CONFIGURATOR_VERSION}"
          release_json="$(gh release view "$minimum_app_tag" --json isDraft,isPrerelease)"
          if ! jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null; then
            echo "Firmware refresh assets require published stable configurator $minimum_app_tag first" >&2
            exit 1
          fi

      - name: Enforce resident bootloader version lineage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag=""
          while IFS= read -r candidate; do
            if [ "$candidate" = "$GITHUB_REF_NAME" ] ||
               [[ ! "$candidate" =~ ^firmware-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              continue
            fi
            if release_json="$(gh release view "$candidate" --json isDraft,isPrerelease 2>/dev/null)" &&
               jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list 'firmware-v*' --sort=-v:refname)
          if [ -z "$previous_tag" ]; then
            echo "No previous published firmware release; bootloader lineage starts here."
            exit 0
          fi

          lineage_dir="$(mktemp -d "$RUNNER_TEMP/kbhe-bootloader-lineage.XXXXXX")"
          case "$lineage_dir" in
            "$RUNNER_TEMP"/kbhe-bootloader-lineage.*) ;;
            *)
              echo "Bootloader lineage directory escaped RUNNER_TEMP" >&2
              exit 1
              ;;
          esac
          cleanup_lineage_dir() {
            find "$lineage_dir" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$lineage_dir"
          }
          trap cleanup_lineage_dir EXIT
          gh release download "$previous_tag" \
            --dir "$lineage_dir" \
            --pattern 'kbhe-bootloader.bin' \
            --pattern 'kbhe-bootloader.bin.sig'
          previous_version="${previous_tag#firmware-v}"
          python tools/release/sign_release_asset.py artifact \
            --input "$lineage_dir/kbhe-bootloader.bin" \
            --signature "$lineage_dir/kbhe-bootloader.bin.sig" \
            --version "$previous_version" \
            --target kbhe-75he-stm32f723vet6 \
            --role kbhe-bootloader.bin \
            --verify-public firmware/keys/firmware-ed25519-public.pem
          python tools/release/build_updater_migration_package.py inspect-lineage \
            --current dist/kbhe-bootloader.bin \
            --previous "$lineage_dir/kbhe-bootloader.bin"

      - name: Sign firmware and factory-programming artifacts
        env:
          SIGNING_KEY_B64: ${{ secrets.KBHE_FIRMWARE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "Missing required KBHE_FIRMWARE_RELEASE_SIGNING_KEY_B64 environment secret" >&2
            exit 1
          fi
          umask 077
          key_path="$RUNNER_TEMP/kbhe-ed25519-private.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$key_path"
          unset SIGNING_KEY_B64
          version="${GITHUB_REF_NAME#firmware-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Firmware tag must be canonical firmware-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          if [ "$major" -gt 255 ] || [ "$minor" -gt 255 ] || [ "$patch" -gt 255 ]; then
            echo "Firmware version components must fit one byte" >&2
            exit 1
          fi
          IFS=. read -r carrier_major carrier_minor carrier_patch \
            <<<"$KBHE_UPDATER_REFRESH_CARRIER_MIN_FIRMWARE_VERSION"
          refresh_carrier=false
          if (( major > carrier_major ||
                (major == carrier_major && minor > carrier_minor) ||
                (major == carrier_major && minor == carrier_minor && patch >= carrier_patch) )); then
            refresh_carrier=true
          fi
          if [ "$refresh_carrier" = true ]; then
            primary_binary="kbhe-app-updater-v3.bin"
          else
            primary_binary="kbhe-app.bin"
          fi

          python tools/release/sign_release_asset.py firmware \
            --key "$key_path" \
            --input dist/kbhe-app.bin \
            --output dist/kbhe-app.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem

          migration_inner="dist/kbhe-updater-v3-refresh.bin"
          python tools/release/build_updater_migration_package.py prepare \
            --migrator dist/kbhe-updater-migrator.bin \
            --bootloader dist/kbhe-bootloader.bin \
            --output "$migration_inner"
          python tools/release/sign_release_asset.py firmware \
            --key "$key_path" \
            --input "$migration_inner" \
            --output dist/kbhe-updater-v3-refresh.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem
          python tools/release/build_updater_migration_package.py inspect-image \
            --input "$migration_inner" \
            --signature dist/kbhe-updater-v3-refresh.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem
          # The v2 capsule trailer embeds the signature of this exact inner
          # image, so its detached sibling is intentionally byte-identical.
          cp dist/kbhe-updater-v3-refresh.bin.sig \
            dist/kbhe-updater-v2-to-v3.bin.sig
          python tools/release/build_updater_migration_package.py assemble \
            --image "$migration_inner" \
            --signature dist/kbhe-updater-v3-refresh.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem \
            --output dist/kbhe-updater-v2-to-v3.bin
          python tools/release/build_updater_migration_package.py inspect \
            --input dist/kbhe-updater-v2-to-v3.bin \
            --signature dist/kbhe-updater-v2-to-v3.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem
          jq \
            --arg minimumConfiguratorVersion "$KBHE_UPDATER_REFRESH_MIN_CONFIGURATOR_VERSION" \
            --arg primaryBinary "$primary_binary" '
              .minimumConfiguratorVersion = $minimumConfiguratorVersion |
              .primaryBinary = $primaryBinary |
              .legacyUpdaterMigration = "kbhe-updater-v2-to-v3.bin" |
              .updaterV3Refresh = "kbhe-updater-v3-refresh.bin" |
              del(.migrationExecutable)' \
            dist/firmware-manifest.json > "$RUNNER_TEMP/firmware-manifest.json"
          mv "$RUNNER_TEMP/firmware-manifest.json" dist/firmware-manifest.json

          # The executable is meaningful only inside the authenticated
          # migration package. Do not publish a raw, easily confused payload.
          rm -f \
            dist/kbhe-updater-migrator.bin \
            dist/kbhe-updater-migrator.hex \
            dist/kbhe-updater-migrator.elf \
            dist/kbhe-updater-migrator.map

          python tools/release/build_factory_image.py \
            --bootloader dist/kbhe-bootloader.bin \
            --app dist/kbhe-app.bin \
            --signature dist/kbhe-app.bin.sig \
            --version "$version" \
            --verify-public firmware/keys/firmware-ed25519-public.pem \
            --output dist/kbhe-factory.bin \
            --manifest dist/firmware-manifest.json

          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            python tools/release/sign_release_asset.py artifact \
              --key "$key_path" \
              --input "$asset" \
              --output "$asset.sig" \
              --version "$version" \
              --target kbhe-75he-stm32f723vet6 \
              --role "$name" \
              --verify-public firmware/keys/firmware-ed25519-public.pem
          # Both updater migration/refresh .sig files deliberately authenticate
          # the exact inner migrator image. Updater v2 cannot verify signatures;
          # the native host verifies this inner signature plus the canonical
          # outer capsule before BEGIN. Never replace either with a generic
          # signature over a differently scoped artifact.
          done < <(find dist -maxdepth 1 -type f \
            ! -name '*.sig' \
            ! -name 'kbhe-app.bin' \
            ! -name 'kbhe-updater-v2-to-v3.bin' \
            ! -name 'kbhe-updater-v3-refresh.bin' \
            -print0)

          if [ "$refresh_carrier" = true ]; then
            mv dist/kbhe-app.bin dist/kbhe-app-updater-v3.bin
            mv dist/kbhe-app.bin.sig dist/kbhe-app-updater-v3.bin.sig
            if [ -e dist/kbhe-app.bin ] || [ -e dist/kbhe-app.bin.sig ]; then
              echo "Refresh-capable releases must not publish the legacy kbhe-app.bin role" >&2
              exit 1
            fi
          elif [ -e dist/kbhe-app-updater-v3.bin ] || [ -e dist/kbhe-app-updater-v3.bin.sig ]; then
            echo "Legacy releases must not publish the refresh carrier role" >&2
            exit 1
          fi

      - name: Create authenticated draft release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true

      - name: Verify authenticated draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
            echo "Refusing to verify an already-published release" >&2
            exit 1
          fi
          verify_dir="$(mktemp -d "$RUNNER_TEMP/kbhe-release-verify.XXXXXX")"
          case "$verify_dir" in
            "$RUNNER_TEMP"/kbhe-release-verify.*) ;;
            *)
              echo "Release verification directory escaped RUNNER_TEMP" >&2
              exit 1
              ;;
          esac
          cleanup_verify_dir() {
            find "$verify_dir" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$verify_dir"
          }
          trap cleanup_verify_dir EXIT

          local_count="$(find dist -maxdepth 1 -type f | wc -l)"
          remote_count="$(jq '.assets | length' <<<"$release_json")"
          if [ "$local_count" -ne "$remote_count" ]; then
            echo "Draft asset count mismatch: local=$local_count remote=$remote_count" >&2
            exit 1
          fi
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            size="$(stat -c '%s' "$asset")"
            matches="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            remote_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            if [ "$matches" -ne 1 ] || [ "$remote_size" -ne "$size" ]; then
              echo "Draft asset mismatch for $name: matches=$matches local=$size remote=$remote_size" >&2
              exit 1
            fi
            gh release download "$GITHUB_REF_NAME" \
              --dir "$verify_dir" \
              --pattern "$name"
            downloaded="$verify_dir/$name"
            if [ ! -f "$downloaded" ]; then
              echo "Draft asset download is missing for $name" >&2
              exit 1
            fi
            local_sha256="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            remote_sha256="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
            if [ "$local_sha256" != "$remote_sha256" ]; then
              echo "Downloaded draft asset digest mismatch for $name" >&2
              exit 1
            fi
          done < <(find dist -maxdepth 1 -type f -print0)
          echo "Authenticated draft verified. Publication is intentionally gated on destructive v2-to-v3 hardware validation."
